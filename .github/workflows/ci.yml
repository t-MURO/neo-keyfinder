name: build-and-test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  VCPKG_ROOT: ${{ github.workspace }}/.vcpkg

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake curl file libappindicator3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf pkg-config
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout f87344cac03158cbf1467264565f1fd36b382a24
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
      - name: Install macOS native build dependencies
        if: runner.os == 'macOS'
        run: brew install cmake ffmpeg taglib libkeyfinder
      - name: Install Windows native build dependencies
        if: runner.os == 'Windows'
        run: |
          git clone https://github.com/microsoft/vcpkg.git "${env:VCPKG_ROOT}"
          git -C "${env:VCPKG_ROOT}" checkout f87344cac03158cbf1467264565f1fd36b382a24
          & "${env:VCPKG_ROOT}\bootstrap-vcpkg.bat" -disableMetrics
      - run: npm ci
      - name: Test Windows with statically linked native dependencies
        if: runner.os == 'Windows'
        env:
          VCPKG_TARGET_TRIPLET: x64-windows-static
        run: npm test
      - name: Test macOS or Linux
        if: runner.os != 'Windows'
        run: npm test
        env:
          VCPKG_TARGET_TRIPLET: ${{ runner.os == 'Linux' && 'x64-linux' || '' }}

  package-windows:
    name: Windows x64 NSIS
    needs: test
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          git clone https://github.com/microsoft/vcpkg.git "${env:VCPKG_ROOT}"
          git -C "${env:VCPKG_ROOT}" checkout f87344cac03158cbf1467264565f1fd36b382a24
          & "${env:VCPKG_ROOT}\bootstrap-vcpkg.bat" -disableMetrics
      - run: npm ci
      - name: Build self-contained native sidecar and NSIS installer
        env:
          VCPKG_TARGET_TRIPLET: x64-windows-static
        run: npm run build -- --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: keyfinder-windows-x64-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  package-linux:
    name: Linux x64 AppImage and DEB
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake curl file libappindicator3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf pkg-config
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout f87344cac03158cbf1467264565f1fd36b382a24
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
      - run: npm ci
      - run: npm run build -- --bundles appimage,deb
        env:
          VCPKG_TARGET_TRIPLET: x64-linux
      - uses: actions/upload-artifact@v4
        with:
          name: keyfinder-linux-x64
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  package-macos:
    name: macOS universal DMG
    needs: test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: |
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout f87344cac03158cbf1467264565f1fd36b382a24
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
      - run: npm ci
      - run: npm run build:macos-universal -- --bundles dmg
      - uses: actions/upload-artifact@v4
        with:
          name: keyfinder-macos-universal-dmg
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
